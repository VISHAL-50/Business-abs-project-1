<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Project-1 — Leads Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

  <!-- Top bar -->
  <header class="border-b-2 border-[#EAB308]/60 bg-[#0B1340] text-white">
    <div class="mx-auto flex max-w-[1400px] flex-wrap items-center justify-between gap-3 px-4 py-4 sm:px-8">
      <div class="flex items-center gap-3">
        <img src="../assets/logo.webp" alt="" class="h-9 w-9 object-contain" onerror="this.style.display='none'">
        <div>
          <p class="text-sm font-extrabold uppercase tracking-[0.16em] text-[#FBBF24]">Project-1 · Leads</p>
          <p class="text-xs text-[#A9B2D9]">Landing page: <span id="landing-page-id" class="font-mono text-white"></span></p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <label for="channel-select" class="text-xs font-semibold text-[#A9B2D9]">Channel:</label>
        <select id="channel-select" class="cursor-pointer rounded-lg border border-[#EAB308]/60 bg-[#1C2456] px-3 py-1.5 text-xs font-bold text-white outline-none focus:ring-2 focus:ring-[#EAB308]">
          <option value="all">All Leads</option>
          <option value="google">Google Leads</option>
          <option value="meta">Meta Leads</option>
          <option value="other">Organic / Other</option>
        </select>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[1400px] px-4 py-8 sm:px-8">

    <!-- Heading + export -->
    <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight md:text-3xl">Leads</h1>
        <p class="mt-1 text-sm text-slate-500">Every registration from the popup, verified or not. Updates live from Firestore.</p>
      </div>
      <button id="export-csv" type="button"
        class="inline-flex items-center justify-center gap-2 rounded-lg bg-[#0B1340] px-4 py-2.5 text-sm font-bold text-white shadow-sm transition hover:bg-[#1C2456]">
        Export CSV
      </button>
    </div>

    <!-- Stat cards -->
    <section id="stat-cards" class="mb-5 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
      <div class="h-[116px] animate-pulse rounded-xl border border-slate-200 bg-white"></div>
      <div class="h-[116px] animate-pulse rounded-xl border border-slate-200 bg-white"></div>
      <div class="h-[116px] animate-pulse rounded-xl border border-slate-200 bg-white"></div>
      <div class="h-[116px] animate-pulse rounded-xl border border-slate-200 bg-white"></div>
    </section>

    <!-- Breakdown panels -->
    <section class="mb-6 grid grid-cols-1 gap-4 lg:grid-cols-3">
      <div class="rounded-xl border border-slate-200 bg-white p-5">
        <h2 class="mb-4 border-b border-slate-100 pb-3 text-base font-bold">Qualification</h2>
        <div id="qualify-panel" class="grid grid-cols-2 gap-5"></div>
      </div>
      <div class="rounded-xl border border-slate-200 bg-white p-5">
        <h2 class="mb-4 border-b border-slate-100 pb-3 text-base font-bold">Top UTM Performance</h2>
        <div id="utm-panel" class="grid grid-cols-1 gap-5 sm:grid-cols-3 lg:grid-cols-1 xl:grid-cols-3"></div>
      </div>
      <div class="rounded-xl border border-slate-200 bg-white p-5">
        <h2 class="mb-4 border-b border-slate-100 pb-3 text-base font-bold">Verification &amp; CRM</h2>
        <div id="status-panel" class="grid grid-cols-2 gap-5"></div>
      </div>
    </section>

    <!-- Table -->
    <section class="overflow-hidden rounded-xl border border-slate-200 bg-white">
      <div class="flex flex-col gap-3 border-b border-slate-200 bg-slate-50/60 p-4 sm:flex-row sm:items-center sm:justify-between">
        <input id="lead-search" type="search" placeholder="Search name, email, phone, UTM, lead ID…"
          class="h-11 w-full rounded-lg border border-slate-300 bg-white px-3 text-sm outline-none transition focus:border-[#EAB308] focus:ring-4 focus:ring-amber-100 sm:max-w-md">
        <div class="inline-flex max-w-full shrink-0 overflow-x-auto whitespace-nowrap rounded-lg border border-slate-300 bg-white p-0.5 text-sm font-semibold" role="tablist">
          <button data-filter="all" class="filter-tab rounded-md px-3.5 py-1.5 transition">All</button>
          <button data-filter="verified" class="filter-tab rounded-md px-3.5 py-1.5 transition">Verified</button>
          <button data-filter="unverified" class="filter-tab rounded-md px-3.5 py-1.5 transition">Unverified</button>
          <button data-filter="not-in-crm" class="filter-tab rounded-md px-3.5 py-1.5 transition">Not in CRM</button>
          <button data-filter="crm-failed" class="filter-tab rounded-md px-3.5 py-1.5 transition">CRM failed</button>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
          <thead class="bg-slate-50">
            <tr class="text-left text-xs font-bold uppercase tracking-wider text-slate-500">
              <th class="px-4 py-3">Customer</th>
              <th class="px-4 py-3">Qualification</th>
              <th class="px-4 py-3">UTM</th>
              <th class="px-4 py-3">Verification &amp; CRM</th>
              <th class="px-4 py-3">Created At</th>
            </tr>
          </thead>
          <tbody id="leads-table-body" class="divide-y divide-slate-100">
            <tr><td colspan="5" class="px-4 py-14 text-center text-sm font-medium text-slate-500">Loading leads…</td></tr>
          </tbody>
        </table>
      </div>

      <div id="pagination" class="flex flex-col items-center justify-between gap-3 border-t border-slate-200 bg-slate-50/60 p-4 text-sm sm:flex-row"></div>
    </section>
  </main>

  <!-- Lead details modal -->
  <div id="lead-modal" class="fixed inset-0 z-50 hidden items-start justify-center overflow-y-auto bg-slate-950/60 p-4 sm:p-8">
    <div class="relative my-auto w-full max-w-3xl rounded-xl bg-white shadow-2xl">
      <div class="flex items-center justify-between rounded-t-xl border-b-2 border-[#EAB308] bg-[#0B1340] px-6 py-4 text-white">
        <div class="min-w-0 pr-4">
          <p class="text-xs font-extrabold uppercase tracking-[0.16em] text-[#FBBF24]">Lead Details</p>
          <h2 id="lead-modal-title" class="mt-0.5 truncate text-xl font-extrabold">Lead</h2>
        </div>
        <button data-close type="button" class="shrink-0 rounded-lg p-1.5 text-[#A9B2D9] transition hover:bg-[#1C2456] hover:text-white" aria-label="Close">✕</button>
      </div>

      <div id="lead-modal-body" class="max-h-[calc(100vh-15rem)] space-y-5 overflow-y-auto bg-slate-50 px-6 py-5"></div>

      <div class="flex flex-col-reverse items-stretch gap-3 rounded-b-xl border-t border-slate-200 bg-slate-100 px-6 py-4 sm:flex-row sm:items-center sm:justify-end">
        <span id="crm-push-msg" class="text-xs font-semibold text-slate-500 sm:mr-auto"></span>
        <button data-close type="button"
          class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-50">Close</button>
        <button id="crm-push-btn" type="button"
          class="inline-flex items-center justify-center rounded-lg bg-[#EAB308] px-4 py-2 text-sm font-extrabold text-[#1C1500] transition hover:bg-[#FBBF24] disabled:cursor-not-allowed disabled:opacity-50">
          Push to CRM
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./admin.js"></script>
</body>

</html>
